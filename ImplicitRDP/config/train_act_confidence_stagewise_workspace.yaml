defaults:
  - task: real_dual_switch_image_wrench_offline_10fps_acp
  - _self_

name: train_dual_switch_act_confidence_stagewise_workspace
_target_: ImplicitRDP.workspace.train_act_confidence_stagewise_workspace.TrainACTConfidenceStagewiseWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
n_action_steps: ${eval:'${horizon}-${dataset_obs_steps}+1'}
n_emb: 768

policy:
  _target_: ImplicitRDP.policy.act_confidence_stagewise_policy.ACTConfidenceStagewisePolicy
  shape_meta: ${task.model_shape_meta}
  
  obs_encoder:
    _target_: ImplicitRDP.model.vision.transformer_obs_encoder.TransformerObsEncoder
    shape_meta: ${task.model_shape_meta}
    obs_horizon: ${n_obs_steps}
    global_pool: ''
    n_emb: ${n_emb}
    model_name: 'resnet34'
    pretrained: False
    frozen: False
    feature_aggregation: null
    downsample_ratio: 32
    transforms:
      - type: CenterCrop
      - _target_: torchvision.transforms.RandomRotation
        degrees:
          - -5.0
          - 5.0
        expand: false
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.3
        contrast: 0.4
        saturation: 0.5
        hue: 0.08
    use_group_norm: True
    share_rgb_model: False
  
  act_model:
    _target_: ImplicitRDP.model.act.act_transformer.ACTTransformer
    shape_meta: ${task.model_shape_meta}
    action_chunk_size: ${n_action_steps}
    n_layer: 6
    n_head: 8
    n_emb: ${n_emb}
    max_cond_tokens: 800
    max_action_history: 32
    p_drop_attn: 0.1
  
  n_emb: ${n_emb}
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}

  use_rnn_obs_encoder: True
  rnn_obs_encoder_n_layer: 1
  rnn_obs_encoder_hidden_dim: 512
  
  # Stagewise training: freeze ACT model and confidence head
  # These are automatically set based on training_stage
  freeze_act_model: False
  freeze_confidence_head: False
  
  # Current training stage: 1 or 2 (will be set automatically during training)
  training_stage: 1
  
  use_amp_for_inference: False
  amp_dtype: "bf16"

  confidence_hidden_dim: ${n_emb}
  confidence_gamma: 1.0
  confidence_alpha: 0.2
  confidence_log_sigma_min: -100
  confidence_log_sigma_max: 100
  confidence_clamp_log_sigma: False
  use_confidence_head: True
  confidence_head_type: transformer
  confidence_obs_encoder_n_layers: 2
  confidence_obs_encoder_hidden_dim: null
  confidence_transformer_n_heads: 8
  confidence_transformer_dropout: 0.1
  confidence_action_dims: 6
  normalize_confidence_loss: False

ckpt_path: null

ema:
  _target_: ImplicitRDP.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  lr: 3.0e-4
  weight_decay: 1.0e-6
  obs_encoder_lr: 3.0e-5
  obs_encoder_weight_decay: 1.0e-6
  confidence_lr: 1.0e-4  # Learning rate for Confidence Head in Stage 2
  confidence_weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  
training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  pretrained_ckpt_path: null
  start_epoch: 0
  use_amp: False
  amp_dtype: "bf16"
  lr_scheduler: cosine
  lr_warmup_steps: 2000

  # Stagewise training settings (must be defined before num_epochs uses them)
  stage1_epochs: 400  # Train ACT, freeze Confidence (using stage1 dataset)
  stage2_epochs: 250  # Train Confidence, freeze ACT (using stage2 dataset)
  # Stage 2 dataset path. If null, uses same dataset as stage 1.
  # Set to a different path to use a different dataset for stage 2.
  stage2_dataset_path: null
  # Example usage:
  # stage2_dataset_path: data/switch_v2_round_1_zarr

  num_epochs: eval:'${training.stage1_epochs}+${training.stage2_epochs}'
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 50 #dummy
  checkpoint_every: 10
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_transformer_tactile
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M-%S}_${name}_${task_name}
  tags: ["stagewise", "single_encoder"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 1
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M-%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M-%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M-%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M-%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
