name: CPU tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install training and test dependencies
        run: |
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-training.txt pytest
      - name: Check shell launchers
        run: |
          for script in *.sh; do bash -n "$script" || exit 1; done
      - name: Run tests
        run: python -m pytest -q
